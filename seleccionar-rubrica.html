<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar Rúbrica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="h-full flex flex-col font-sans text-slate-800 antialiased bg-slate-100">

    <!-- Header -->
    <header class="bg-emerald-600 text-white shadow-md py-6 px-4">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-wider uppercase">Seleccionar Rúbrica</h1>
                <p class="text-emerald-200 text-sm">Elige una rúbrica para comenzar la evaluación</p>
            </div>
            <div class="flex items-center space-x-4">
                <a href="perfil.html" class="text-white hover:text-emerald-200 transition-colors text-sm font-semibold flex items-center space-x-2">
                    <i class="fa-solid fa-user"></i>
                    <span class="hidden sm:inline">Perfil</span>
                </a>
                <a href="index.html" class="text-white hover:text-emerald-200 transition-colors">
                    <i class="fa-solid fa-arrow-left text-xl"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-12">
        <div id="rubrics-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Rúbricas cargadas dinámicamente -->
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="bg-white border-t border-slate-300 py-4 mt-auto text-center text-xs text-slate-500">
        Sistema de Rúbricas - Fernando Oliveros Ocampo<br>
        © <span id="current-year"></span> Todos los derechos reservados
    </footer>

    <script src="app.js"></script>
    <script>
        class SelectionApp {
            constructor() {
                this.init();
            }

            async init() {
                const yearElement = document.getElementById('current-year');
                if (yearElement) {
                    yearElement.textContent = new Date().getFullYear();
                }
                await rubricManager.init();
                if (!rubricManager.getCurrentUser()) {
                    window.location.href = 'login.html';
                    return;
                }
                this.renderRubrics();
            }

            renderRubrics() {
                const container = document.getElementById('rubrics-container');
                const rubrics = rubricManager.getAllRubrics();

                if (rubrics.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full text-center py-12 text-slate-400">
                            <i class="fa-solid fa-folder-open text-4xl mb-3"></i>
                            <p class="text-sm">No hay rúbricas creadas.</p>
                            <a href="admin.html" class="inline-block mt-4 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded transition-all">
                                <i class="fa-solid fa-plus mr-2"></i>Crear primera rúbrica
                            </a>
                        </div>
                    `;
                    return;
                }

                let html = '';
                rubrics.forEach(rubric => {
                    const totalWeight = rubric.criterios.reduce((sum, c) => sum + c.weight, 0);
                    const gradosCount = rubric.grados ? Object.keys(rubric.grados).length : 0;
                    const fecha = new Date(rubric.updated_at || rubric.created_at).toLocaleDateString('es-ES');

                    html += `
                        <a href="evaluacion.html?rubric=${rubric.id}" class="group bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden hover:shadow-xl transition-all hover:border-emerald-400">
                            <div class="bg-gradient-to-r from-emerald-600 to-emerald-700 p-4 text-white">
                                <div class="flex items-center justify-between">
                                    <div class="flex-1">
                                        <h3 class="font-bold text-lg mb-1 truncate">${rubric.nombre}</h3>
                                        <p class="text-emerald-200 text-xs truncate">${rubric.descripcion || 'Sin descripción'}</p>
                                    </div>
                                    <i class="fa-solid fa-clipboard-check text-3xl opacity-80 group-hover:scale-110 transition-transform duration-300 ml-4"></i>
                                </div>
                            </div>
                            <div class="p-4">
                                <div class="flex items-center justify-between text-xs text-slate-500 mb-4">
                                    <span><i class="fa-solid fa-list-check mr-1"></i> ${rubric.criterios.length} criterios</span>
                                    <span><i class="fa-solid fa-percent mr-1"></i> ${totalWeight}%</span>
                                </div>
                                <div class="flex items-center justify-between text-xs text-slate-500 mb-4">
                                    <span><i class="fa-solid fa-users mr-1"></i> ${gradosCount} grados</span>
                                    <span><i class="fa-solid fa-calendar mr-1"></i> ${fecha}</span>
                                </div>
                                <div class="flex items-center text-emerald-600 font-semibold text-sm group-hover:text-emerald-800 transition-colors">
                                    <span>Seleccionar</span>
                                    <i class="fa-solid fa-arrow-right ml-2 group-hover:translate-x-1 transition-transform"></i>
                                </div>
                            </div>
                        </a>
                    `;
                });

                container.innerHTML = html;
            }
        }

        let selectionApp;
        window.addEventListener('DOMContentLoaded', () => {
            selectionApp = new SelectionApp();
        });
    </script>
</body>
</html>
